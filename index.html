<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rumbo a la Rosada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf6e3; --ink:#15152e; --card:#ffffff; --surface:#ffffff; --muted:#5f5d78; --line:#15152e; --edge:#15152e; --night:#15152e;
  --text2:#2c2b45; --okbg:#dff7ec; --badbg:#ffe6ea; --midbg:#fff4c9; --line2:#e8e1cf; --gridtxt:#6b6985;
  --cel:#6ec6f5; --cel2:#2f8fe0; --sol:#ffd23f; --rosa:#ff5c8a; --verde:#20c997; --rojo:#ef3b3b;
  --soft:#f3eddc; --shadow:4px 4px 0 var(--edge);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#11111f; --ink:#ecebff; --card:#1c1b33; --surface:#1c1b33; --muted:#a6a3c6; --line:#6f6c99; --edge:#000000; --night:#0a0a17;
  --text2:#d8d6f0; --okbg:#123a2c; --badbg:#41182a; --midbg:#3b3415; --line2:#2d2c4a; --gridtxt:#9d9abd;
  --soft:#2a2946; --rojo:#ff6b6b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{background:linear-gradient(100deg,var(--cel) 0%,#8fd6ff 45%,#ffe58a 100%);border-bottom:3px solid var(--line)}
.top-in{max-width:1320px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.sun{width:38px;height:38px;border-radius:50%;background:var(--sol);border:3px solid var(--line);display:grid;place-items:center;font-size:18px;box-shadow:0 0 0 4px rgba(255,210,63,.45)}
.logo h1{font-size:22px;font-weight:800}
.logo small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:3px 3px 0 var(--edge)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.who b{font-size:14px}.who span{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.hbtn{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--edge)}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.weekchip{background:var(--night);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.weekchip em{font-style:normal;color:var(--sol)}

/* ---------- resource bar ---------- */
.resbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:3px solid var(--line)}
.resbar-in{max-width:1320px;margin:auto;padding:10px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto auto;gap:14px;align-items:center}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;position:relative}
.res .ic{grid-row:span 2;font-size:22px}
.res .lb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.res .val{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.meter{grid-column:2/4;height:10px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .4s}
.res.warn .val{color:var(--rojo)}
.res .q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);font-size:10px;margin-left:4px;cursor:help;vertical-align:1px}
.tip{position:absolute;top:calc(100% + 8px);left:0;width:260px;background:var(--night);color:#fff;font-size:12.5px;font-weight:500;padding:10px 12px;border-radius:10px;z-index:40;display:none;text-transform:none;letter-spacing:0;line-height:1.4}
.res:hover .tip,.res:focus-within .tip{display:block}
.mini{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;background:var(--soft);white-space:nowrap}
.apdots{display:inline-flex;gap:4px}
.apdots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.apdots i.on{background:var(--rosa)}

/* ---------- layout ---------- */
.layout{max-width:1320px;margin:auto;padding:20px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
aside{position:sticky;top:78px;display:flex;flex-direction:column;gap:18px}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:20px;font-weight:800}
.card h3{font-size:16px;font-weight:800}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- stepper ---------- */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:center;opacity:.55}
.step .n{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none;background:var(--surface)}
.step b{display:block;font-size:14px}.step span{font-size:12px;color:var(--muted)}
.step.cur{opacity:1;background:var(--sol);box-shadow:var(--shadow)}
.step.cur .n{background:var(--night);color:var(--sol)}
.step.done{opacity:1;background:#e6f8f1}
.step.done .n{background:var(--verde);color:#fff}
.hint{margin-top:12px;display:flex;gap:10px;align-items:center;background:var(--night);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
.hint .em{font-size:20px}

/* ---------- event ---------- */
.event{position:relative;overflow:hidden}
.event::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(90deg,var(--rosa) 0 24px,var(--sol) 24px 48px,var(--cel) 48px 72px)}
.ev-head{display:flex;align-items:center;gap:10px;margin:6px 0 6px;flex-wrap:wrap}
.tag{background:var(--rosa);color:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ev-title{font-size:26px;font-weight:800;line-height:1.15;margin:4px 0 8px}
.ev-txt{font-size:15.5px;color:var(--text2);margin:0 0 14px;max-width:70ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:12px;text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--edge);transition:transform .08s,background .15s}
.opt:hover:not(:disabled){background:#fff8d6;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.opt:disabled{opacity:.45}
.opt .k{width:36px;height:36px;border-radius:10px;background:var(--cel);border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:16px}
.opt b{font-size:15.5px}
.opt p{margin:2px 0 6px;color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;border:1.5px solid currentColor;white-space:nowrap}
.chip.pos{color:#0b7a55;background:#e3f8ef}
.chip.neg{color:#c0262f;background:#ffe9ea}
.chip.neu{color:#4b4a66;background:#f1eff7}
.chip.risk{color:#7a4b00;background:#fff1c7}
.riskrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.resolved{border:2.5px dashed var(--ink);border-radius:14px;padding:12px 14px;background:#f6fff9}
.resolved.bad{background:#fff3f3}
.resolved b{font-size:15px}

/* ---------- agenda ---------- */
.agenda.locked{position:relative}
.agenda.locked .blk{filter:grayscale(.8);opacity:.35;pointer-events:none}
.lockmsg{position:absolute;inset:60px 20px auto 20px;z-index:3;text-align:center;background:var(--night);color:#fff;border-radius:14px;padding:14px;font-weight:700}
.sub{display:flex;align-items:baseline;gap:10px;margin:16px 0 10px}
.sub .num{width:26px;height:26px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sub h3{font-size:16px;white-space:nowrap}
.sub span{color:var(--muted);font-size:13px}
.regions{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"norte norte caba" "cuyo centro pba" "pata pata pba";gap:8px}
.rt{border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;position:relative;overflow:hidden;min-height:78px}
.rt .bar{position:absolute;left:0;top:0;bottom:0;width:8px}
.rt .nm{font-weight:800;font-size:14px;padding-left:6px}
.rt .meta{font-size:12px;color:var(--muted);padding-left:6px}
.rt .yours{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:800;font-size:22px;padding-left:6px}
.rt .w{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;background:var(--soft);border-radius:6px;padding:1px 6px}
.rt.sel{background:#fff6c8;box-shadow:0 0 0 3px var(--rosa) inset,3px 3px 0 var(--edge)}
.rt:hover{background:#fffbe8}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:3px 3px 0 var(--edge);display:flex;flex-direction:column;gap:5px;transition:transform .08s,background .15s;position:relative}
.act:hover:not(:disabled){background:#eaf7ff;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.act:disabled{opacity:.42;box-shadow:none}
.act .t{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14.5px}
.act .t .i{font-size:20px}
.act p{margin:0;font-size:12.5px;color:var(--muted)}
.act .pv{font-weight:800;font-size:13px;color:#0b6b4b}
.act .pv.neg{color:#b02a2a}
.act .why{font-size:11.5px;font-weight:700;color:var(--rojo)}
.act .loc{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;background:#ffe3ec;border:1.5px solid var(--rosa);color:#b0204c;border-radius:6px;padding:0 6px}
.closebar{margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.big{background:var(--rosa);color:#fff;border:2.5px solid var(--line);border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.big:hover:not(:disabled){filter:brightness(1.05);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--edge)}
.big:disabled{opacity:.4}
.big.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:4px 4px 0 var(--edge),0 0 0 8px rgba(255,92,138,.3)}}
.big.alt{background:var(--sol);color:var(--ink)}
.big.ghost{background:var(--surface);color:var(--ink)}

/* ---------- sidebar ---------- */
.count{background:var(--night);color:#fff;border-radius:18px;padding:16px 18px;border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--rosa)}
.count .d{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-size:54px;font-weight:800;line-height:1;color:var(--sol)}
.count .lbl{font-size:13px;opacity:.85}
.track{display:flex;gap:4px;margin-top:14px}
.track i{flex:1;height:20px;border-radius:5px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;font-style:normal}
.track i.past{background:var(--cel2)}
.track i.now{background:var(--sol);color:var(--ink);font-weight:800}
.mile{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:8px;gap:8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.legend b{font-weight:800}
svg text{font-family:Inter,sans-serif}
.polls{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.prow{display:grid;grid-template-columns:116px 1fr 46px;gap:8px;align-items:center;font-size:13px}
.prow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tr{height:16px;background:var(--soft);border-radius:6px;overflow:hidden;border:1.5px solid var(--line)}
.prow .tr i{display:block;height:100%}
.prow .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.prow.me .nm::after{content:" ◀ vos";color:var(--rosa);font-size:11px}
.verdict{margin-top:12px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px;border:2px solid var(--line)}
.rule{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- log ---------- */
.log{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.lw{border-left:4px solid var(--cel2);padding:2px 0 2px 12px}
.lw b{font-size:13px}
.lw ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}

/* ---------- modal & toasts ---------- */
.modal{position:fixed;inset:0;background:rgba(21,21,46,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.mbox{background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:8px 8px 0 var(--edge);max-width:640px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.mbox h2{font-size:26px;font-weight:800;margin-bottom:6px}
.cmp{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.cmp td{padding:6px 4px;border-bottom:1.5px solid var(--line2)}
.cmp td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.up{color:#0b7a55}.dn{color:#c0262f}
.mlist{margin:6px 0 0;padding-left:18px;font-size:14px}
.mlist li{margin:3px 0}
#toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--night);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--rosa);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* ---------- start ---------- */
.start{max-width:1100px;margin:auto;padding:28px 16px 60px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;margin-bottom:24px}
.hero h2{font-size:48px;font-weight:800;line-height:1.02}
.hero h2 span{background:var(--sol);padding:0 8px;border:3px solid var(--line);border-radius:12px;display:inline-block;transform:rotate(-1.5deg)}
.hero p{font-size:16px;color:var(--text2);max-width:58ch}
.how{display:grid;gap:10px}
.how>div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:3px 3px 0 var(--edge)}
.how .n{width:30px;height:30px;border-radius:50%;background:var(--rosa);color:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.how b{display:block}
.how span{font-size:13px;color:var(--muted)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cand{text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:16px;padding:0;overflow:hidden;box-shadow:3px 3px 0 var(--edge);display:flex;flex-direction:column}
.cand .hd{padding:12px 14px;color:#fff;border-bottom:2.5px solid var(--line)}
.cand .hd small{font-weight:800;letter-spacing:.1em;font-size:11px;text-transform:uppercase;opacity:.9}
.cand .hd b{display:block;font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-size:20px;font-weight:800;line-height:1.1}
.cand .bd{padding:10px 14px 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.cand .bd .df{font-weight:800;font-size:12px}
.cand.sel{box-shadow:0 0 0 4px var(--rosa),6px 6px 0 var(--edge);transform:translate(-2px,-2px)}
.seg{display:inline-flex;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.seg button{border:0;background:var(--surface);padding:9px 14px;font-weight:700;font-size:13.5px;border-right:2px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--night);color:var(--sol)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:20px}
.note{font-size:12.5px;color:var(--muted);margin-top:18px}


.seg.scen{flex-wrap:wrap}
.scintro{font-size:14px;color:var(--text2);margin:12px 0 0;max-width:80ch}
.custom .crows{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:auto 44px 70px minmax(0,1.2fr) minmax(0,1.2fr) 88px 140px 140px 38px;gap:8px;align-items:center}
.crow input,.crow select,.pctin input{font:inherit;color:var(--ink);font-size:14px;border:2px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--surface);min-width:0;width:100%}
.crow input[type=color]{padding:2px;height:38px;cursor:pointer}
.pctin{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.pctin input{width:76px}
.me-pick{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.hbtn.x{padding:6px 10px}
.pvr{margin:8px 0}.pvr summary{cursor:pointer;font-weight:800;font-size:14px}
.chip.ideo{color:#5b2a86;background:#f1e6ff}
.agnote{font-size:13px;font-weight:700;color:#5b2a86;background:#f6efff;border-radius:10px;padding:6px 10px;margin:-4px 0 12px;display:inline-block}
.disc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.db{background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;box-shadow:3px 3px 0 var(--edge);font-size:12.5px}
.db b{font-size:16px}.db .pv{font-weight:800;color:#0b6b4b}.db .pv.neg{color:#b02a2a}.db .why{font-size:11px;font-weight:700;color:var(--rojo)}
.db.on{background:#f1e6ff;box-shadow:0 0 0 3px #7b2cbf inset,3px 3px 0 var(--edge)}
.db:hover{background:#faf5ff}
.seats{display:flex;height:22px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.seats i{display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800;border-right:1.5px solid #fff;min-width:3px}
.seats i:last-child{border-right:0}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-1px}
.swan{background:var(--night);color:#fff;border-radius:14px;padding:12px 14px;margin:8px 0 12px;border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--sol)}
.swan .eyebrow{color:var(--sol)}.swan h3{font-size:19px;margin:2px 0 4px}.swan p{margin:4px 0;font-size:14px}.swan .rule{color:#cfcde0}
.mbox{position:relative}
.mclose{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);font-weight:800;box-shadow:2px 2px 0 var(--edge)}
.finalbar{background:var(--night);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:4px 4px 0 var(--rosa)}
.finalbar b{font-size:18px}.fbtns{display:flex;gap:10px;flex-wrap:wrap}.fbtns .big{padding:10px 16px;font-size:14px}
@media (max-width:640px){.sub{flex-wrap:wrap}.sub>span:last-child{flex-basis:100%}}
@media (max-width:640px){.disc{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.db{padding:6px 2px;font-size:10.5px}.db span:nth-of-type(1){display:none}}
.mom{font-size:10px;font-weight:800;letter-spacing:-1px;display:inline-block;min-width:16px}

function buildScenario(key){
  let src, compress=true, custom=key==='custom';
  if(custom){
    const cc=setup.custom; compress=false;
    src={y:2027, e1:[2027,9,24], und:cc.und, custom:true, mu:0, pol:.3, intro:'Tu propia elección: partidos, colores y porcentajes iniciales a tu gusto.', real:null,

        vp:null, color:c.color, pct:Math.max(.5,+c.pct||0), lean:clamp(+c.lean||0,-1,1), trait:['aparato','billetera','viral','militancia','territorial','prestigio'][i%6],

  } else src=SCEN[key];
  const und=clamp(+src.und||0,0,40);
  let t=src.cands.map(c=>compress?c.pct*.85+2:c.pct);
  const tot=t.reduce((a,b)=>a+b,0); t=t.map(v=>v/tot*(100-und));
  const sorted=t.slice().sort((a,b)=>b-a);
  const cands=src.cands.map((c,i)=>{
    const valid=t[i]/(100-und)*100;
    const win=custom?valid>=Math.min(20,sorted[1]/(100-und)*100*.8):!!c.win;
    const goal=win?{type:'win'}:{type:"pct",v:Math.round((valid+5.5)*2)/2};
    let diff;
    if(!win) diff='Desafío propio';
    else if(t[i]>=sorted[0]-.01) diff='Accesible'; else if(sorted[0]-t[i]<6) diff='Parejo'; else if(sorted[0]-t[i]<14) diff='Cuesta arriba'; else diff='Muy difícil';
    return {...c, start:t[i], goal, diff, str:clamp(.3+t[i]/45,.4,1.1),
      aff:c.prof.map(p=>clamp(.55+.45*p,.7,1.45)), traitTxt:TRAITS[c.trait]};
  });
  // reparto regional (ajuste proporcional iterativo para respetar el total nacional)
  const n=cands.length;
  let sh=REG.map((_,r)=>cands.map((c,i)=>t[i]*c.prof[r]));
  for(let it=0;it<60;it++){
    sh=sh.map(row=>{const s=row.reduce((a,b)=>a+b,0);return row.map(v=>v/s*(100-und))});
    const nat=Array(n).fill(0); sh.forEach((row,r)=>row.forEach((v,i)=>nat[i]+=v*REG[r].w));
    sh=sh.map(row=>row.map((v,i)=>v*t[i]/nat[i]));
  }
  sh=sh.map(row=>{const s=row.reduce((a,b)=>a+b,0);return row.map(v=>v/s*(100-und)).concat([und])});
  const [Y,M,D]=src.e1; const e1=new Date(Y,M,D);
  return {key, y:src.y, mu:src.mu??0, pol:src.pol??.3, hypo:!!src.hypo, custom, intro:src.intro, real:src.real, cands, base:sh,
    e1, e2:new Date(e1.getTime()+28*86400000), s1:new Date(e1.getTime()-83*86400000), s2:new Date(e1.getTime()+86400000)};
}

let S = null;

function initTheme(){let t=null;try{t=localStorage.getItem('rosada_theme')}catch(e){}if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('rosada_theme',t)}catch(e){}render()}
const themeBtn=()=>`<button class="hbtn themebtn" onclick="toggleTheme()" title="Cambiar a modo ${document.documentElement.dataset.theme==='dark'?'claro':'oscuro'}" aria-label="Cambiar tema">${document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}</button>`;
initTheme();
let setup = {scen:'2023', cand:1, diff:'normal', tut:true, custom:loadCustom(), customPlayer:0};
function loadCustom(){try{const v=JSON.parse(localStorage.getItem('rosada_custom'));if(v&&v.cands&&v.cands.length>=2)return v}catch(e){}return JSON.parse(JSON.stringify(CUSTOM_DEFAULT))}
function saveCustom(){try{localStorage.setItem('rosada_custom',JSON.stringify(setup.custom))}catch(e){}}
const $ = s => document.querySelector(s);
const fmt = (x,d=1) => (Math.round(x*10**d)/10**d).toFixed(d).replace('.',',');
const sgn = (x,d=1) => (x>0?'+':x<0?'−':'±')+fmt(Math.abs(x),d);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const rnd = Math.random;
const esc = t => String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function randn(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function wpick(w){const t=w.reduce((a,b)=>a+b,0);let x=rnd()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return w.length-1}
const val = (v,s) => typeof v==='function'?v(s):v;
/* volatilidad: los efectos sobre votos salen mejor o peor de lo previsto */
function vol(g){return g>0?g*Math.max(-.35,1+.5*randn()):g*Math.max(0,1+.4*randn())}
const rng = g => `${fmt(Math.max(-.35*g,g*.36))} a ${fmt(g*1.64)}`;
const fdate = d => `${d.getDate()} ${MES[d.getMonth()]}`;
const sn = c => C[c].short || C[c].name.split(' ').slice(-1)[0];
const trait = k => C[S.p].trait===k;

function national(sh=S.sh){const n=Array(U+1).fill(0);REG.forEach((r,i)=>sh[i].forEach((v,c)=>n[c]+=v*r.w));return n}
const rivals = () => S.active.filter(c=>c!==S.p);
function topRival(){const n=national();return rivals().sort((a,b)=>n[b]-n[a])[0]}
const opp = () => rivals()[0];
function bestRegion(){const a=C[S.p].aff;let b=0;a.forEach((v,i)=>{if(v+REG[i].w*.3>a[b]+REG[b].w*.3)b=i});return b}
const power = () => (0.55+S.res.i*0.009)*(S.res.e<20?0.6:1);
const totalTurns = () => S.round===1?T1:T2;
const debateTurn = () => S.round===1?DEB1:DEB2;
const weekDate = () => new Date((S.round===1?SC.s1:SC.s2).getTime()+7*86400000*(S.turn-1));
const elecDate = () => S.round===1?SC.e1:SC.e2;
const daysLeft = () => Math.round((elecDate()-weekDate())/86400000);
const regMult = r => (trait('territorial')&&C[S.p].aff[r]>=1.15)?1.25:1;

/* mover votos: g>0 suma al candidato c en la región r (60% de indecisos, resto de rivales) */
function shift(r,c,g){
  const s=S.sh[r]; const others=S.active.filter(o=>o!==c);
  if(g>0){
    let got=0, take=Math.min(g*.6,s[U]); s[U]-=take; got+=take; let rest=g-take;
    const tot=others.reduce((a,o)=>a+s[o],0);
    if(tot>0){const t=Math.min(rest,tot*.5);others.forEach(o=>s[o]-=t*s[o]/tot);got+=t;rest-=t}
    if(rest>0){const t=Math.min(rest,s[U]);s[U]-=t;got+=t}
    s[c]+=got;
  } else if(g<0){
    const amt=Math.min(-g,s[c]); s[c]-=amt; s[U]+=amt*.5;
    const tot=others.reduce((a,o)=>a+s[o],0);
    if(tot>0) others.forEach(o=>s[o]+=amt*.5*s[o]/tot); else s[U]+=amt*.5;
  }
}
const natShift = (c,g) => REG.forEach((_,r)=>shift(r,c,g));

function makePoll(){
  const n=national(), sd=S.precise>0?.5:1.6, p=Array(U+1).fill(null); let sum=0;
  S.active.forEach(c=>{p[c]=Math.max(.3,n[c]+S.bias[c]*(S.precise>0?.4:1)+randn()*sd);sum+=p[c]});
  p[U]=clamp(n[U]+randn()*sd*.5,.5,45);
  const k=(100-p[U])/sum; S.active.forEach(c=>p[c]*=k); return p;
}
const lastPoll = () => {for(let i=S.hist.length-1;i>=0;i--) if(!S.hist[i].result) return S.hist[i].poll; return S.hist[0].poll};

/* =========================================================
   MOMENTUM: las tendencias se arrastran de semana a semana, hasta que cambian
   ========================================================= */
function momentumStep(lines){
  const n=national();
  S.active.forEach(c=>{
    const d=S.prevNat?clamp(n[c]-S.prevNat[c],-2,2):0;
    let m=(S.mom[c]||0)*(C[c].hot?.72:.55)+d*.3+randn()*.15;
    const who=c===S.p?'Tu candidatura':esc(C[c].name);
    if(Math.abs(m)>.35&&rnd()<.08){m=-m*.8;lines.push(`🔄 <b>Cambio de tendencia:</b> <b style="color:${C[c].color}">${who}</b> ${m>0?'empieza a recuperarse':'empieza a desinflarse'}`)}
    m=clamp(m,-1.2,C[c].hot?1.4:1.2);
    const old=S.mom[c]||0;
    if(m>.6&&old<=.6) lines.push(`📈 <b style="color:${C[c].color}">${who}</b> tiene viento de cola`);
    if(m<-.6&&old>=-.6) lines.push(`📉 <b style="color:${C[c].color}">${who}</b> viene en caída`);
    S.mom[c]=m; natShift(c,m);
  });
}
const momIcon=c=>{const m=S.mom[c]||0;return m>.6?'<span class="mom up" title="Tendencia: crece fuerte">▲▲</span>':m>.2?'<span class="mom up" title="Tendencia: crece">▲</span>':m<-.6?'<span class="mom dn" title="Tendencia: cae fuerte">▼▼</span>':m<-.2?'<span class="mom dn" title="Tendencia: cae">▼</span>':'<span class="mom fl" title="Tendencia: estable">▶</span>'};

/* =========================================================
   MODELO IDEOLÓGICO (votantes distribuidos en un eje izquierda–derecha)
   ========================================================= */
const LAM=1.5, KAPPA=.42, STEP=.07;
const GRID=[];for(let v=-1.5;v<=1.5001;v+=.05)GRID.push(+v.toFixed(2));
function dens(mu,pol){const sd=.42;const N=(x,m)=>Math.exp(-.5*((x-m)/sd)**2);const d=GRID.map(v=>.5*N(v,mu-pol)+.5*N(v,mu+pol));const t=d.reduce((a,b)=>a+b,0);return d.map(x=>x/t)}
function spShares(V,V0,pos,mu,pol){const d=dens(mu,pol);const m=pos.map(()=>0);let m0=0;const e0=Math.exp(V0);
  GRID.forEach((v,g)=>{const u=pos.map((p,i)=>Math.exp(V[i]-LAM*(v-p)**2));const t=u.reduce((a,b)=>a+b,0)+e0;u.forEach((x,i)=>m[i]+=d[g]*x/t);m0+=d[g]*e0/t});return {m,m0}}
function spCalib(act=S.active){const n=national();const t=act.map(c=>Math.max(.3,n[c])/100);const t0=Math.max(.01,1-t.reduce((a,b)=>a+b,0));const pos=act.map(c=>S.pos[c]);
  let V=pos.map(()=>0),V0=0;for(let it=0;it<80;it++){const {m,m0}=spShares(V,V0,pos,S.mu,S.pol);V=V.map((x,i)=>x+Math.log(t[i]/m[i]));V0+=Math.log(t0/m0)}
  return {act,V,V0,base:spShares(V,V0,pos,S.mu,S.pol)}}
function spEval(cal,posArr,mu=S.mu,pol=S.pol){const r=spShares(cal.V,cal.V0,cal.act.map(c=>posArr[c]),mu,pol);return cal.act.map((c,i)=>(r.m[i]-cal.base.m[i])*100*KAPPA)}
function applyNatDelta(act,d){S.sh.forEach(row=>{const tot=row.reduce((a,b)=>a+b,0);const blank=Math.max(0,100-tot);const old=act.reduce((a,c)=>a+row[c],0);
  act.forEach((c,i)=>{row[c]=Math.max(.2,row[c]+d[i])});const ds=act.reduce((a,c)=>a+row[c],0)-old;const out=row[U]+blank;

function imgDelta(d){ if(d<0&&trait('viral'))d*=1.3; if(d>0&&trait('prestigio'))d*=1.5; return d; }
function applyEff(e,opt={}){
  if(!e) return {};
  if(opt.ch) e=scaleEff(e,chF(opt.ch));
  const m=power(), viral=(opt.viral&&trait('viral'))?1.4:1, out={...e};
  if(e.f) S.res.f=clamp(S.res.f+e.f,0,100);
  if(e.e) S.res.e=clamp(S.res.e+e.e,0,100);
  if(e.i){const d=imgDelta(e.i);S.res.i=clamp(S.res.i+d,0,100);out.i=Math.round(d)}
  if(e.nat){const g=vol(e.nat>0?e.nat*m*viral:e.nat);natShift(S.p,g);out.nat=g}
  if(e.reg) out.reg=e.reg.map(([r,a])=>{const g=vol(a>0?a*m*C[S.p].aff[r]*regMult(r):a);shift(r,S.p,g);return [r,g]});
  if(e.best){const g=vol(e.best*m);shift(bestRegion(),S.p,g);out.best=g}
  if(e.riv){const g=vol(e.riv*m);natShift(topRival(),-g);out.riv=g}
  if(e.prep) S.prep=clamp(S.prep+e.prep,0,100);
  if(e.precise) S.precise=Math.max(S.precise,e.precise);
  if(e.fiscal) S.fiscal+=e.fiscal;
  return out;
}
function chips(e,approx=true){
  if(!e) return '';
  const out=[]; const c=(cls,t)=>out.push(`<span class="chip ${cls}">${t}</span>`);
  if(e.f) c(e.f>0?'pos':'neg',`${sgn(e.f,0)} 💰 fondos`);
  if(e.e) c(e.e>0?'pos':'neg',`${sgn(e.e,0)} ⚡ energía`);
  if(e.i) c(e.i>0?'pos':'neg',`${sgn(e.i,0)} ⭐ imagen`);
  if(e.nat) c(e.nat>0?'pos':'neg',`${approx?'~':''}${sgn(e.nat)} pts en todo el país`);
  if(e.reg) e.reg.forEach(([r,a])=>c(a>0?'pos':'neg',`${approx?'~':''}${sgn(a)} pts en ${REG[r].k}`));
  if(e.best) c('pos',`${approx?'~':''}${sgn(e.best)} pts en ${REG[bestRegion()].k}`);
  if(e.riv) c('pos',`${approx?'~':''}−${fmt(e.riv)} pts a ${esc(sn(topRival()))}`);
  if(e.xfer) c('pos',`${approx?'~':''}+${fmt(e.xfer)} pts por el acuerdo`);
  if(e.lose) c('neg',`${approx?'~':''}−${fmt(e.lose)} pts (votos que se van)`);
  if(e.oppgain) c('neg',`${approx?'~':''}+${fmt(e.oppgain)} pts a ${esc(e.oppname||'tu rival')}`);
  if(e.prep) c('pos',`+${e.prep} preparación debate`);
  if(e.precise) c('neu','📊 encuestas precisas');
  if(e.fiscal) c('pos',`+${e.fiscal} 🛡️ militancia`);
  if(!out.length) c('neu','sin efectos');
  return out.join('');
}

function pickEvent(){
  const ev=pickEvent0();
  if(AGENDA[ev.id]) S.muPend+=AGENDA[ev.id];
  return ev;
}
function pickEvent0(){
  const fixed=(S.round===1&&(S.turn===1||S.turn===DEB1||S.turn===T1))||(S.round===2&&(S.turn===1||S.turn===DEB2||S.turn===T2));
  const se=scenarioEvent(fixed); if(se) return se;
  if(S.forced&&!fixed){const f=S.forced;S.forced=null;return f}
  if(S.round===1){
    if(S.turn===1) return EV_START;
    if(S.turn===DEB1) return debateEvent();
    if(S.turn===T1) return EV_CIERRE;
    if(rnd()<.35) return negEvent();
  } else {
    if(S.turn===1) return EV_BAL;
    if(S.turn===2){const e=evEndorse(); if(e) return e;}
    if(S.turn===DEB2) return debateEvent();
    if(S.turn===T2) return EV_CIERRE;
  }
  if(S.round===2&&rnd()<.4) return evGober();
  const pool=POOL.filter(e=>!S.used.has(e.id));
  const ev=pool[Math.floor(rnd()*pool.length)]; S.used.add(ev.id); mediaShift(ev); return ev;
}

function bestAlly(c,exclude=[]){return S.active.filter(o=>o!==c&&!exclude.includes(o)&&canDeal(c,o)).sort((a,b)=>natOf(b)*prox(c,b)-natOf(a)*prox(c,a))[0]}
function withdraw(c,to,fTo){
  const others=S.active.filter(o=>o!==c&&o!==to); const w={}; let wt=0;
  others.forEach(o=>{w[o]=prox(c,o)**2*Math.max(.5,natOf(o));wt+=w[o]});
  S.wd[c]={sh:S.sh.map(r=>r[c]),nat:natOf(c),to,week:S.turn};
  let gain=0;
  S.sh.forEach((s,r)=>{const v=s[c];s[c]=0;s[to]+=v*fTo;gain+=v*fTo*REG[r].w;const rest=v*(1-fTo);
    if(wt){s[U]+=rest*.6;others.forEach(o=>s[o]+=rest*.4*w[o]/wt)} else s[U]+=rest});
  S.active=S.active.filter(o=>o!==c);

}

function negEvent(){
  const types=[];
  const small=rivals().filter(c=>!S.allied.has(c)&&natOf(c)<natOf(S.p)&&natOf(c)<14&&canDeal(c,S.p));
  if(small.length) types.push(()=>evApoyo(small[wpick(small.map(c=>prox(c,S.p)+.2))]));
  const big=rivals().filter(c=>!S.pact.has(c)&&natOf(c)>=natOf(S.p)*.6&&canDeal(c,S.p,PACT));

  return types[Math.floor(rnd()*types.length)]();

function chooseOpt(i){
  if(S.phase!=='event') return;
  const ev=S.ev, o=ev.opts[i];
  let res={opt:o.l, good:true};
  if(ev.debate&&S.deb.ask){
    if(o.go){S.deb.ask=false; render(); return;}
    const fx=applyEff({nat:-.6,i:-3}); S.mom[S.p]=clamp((S.mom[S.p]||0)-.8,-1.2,1.4);
    const rk=rivals().map(c=>({c,s:38+C[c].str*22+randn()*15})).sort((x,y)=>y.s-x.s);
    rk.forEach((x,r)=>{const dm=rk.length>1?.6-1.0*r/(rk.length-1):.4; S.mom[x.c]=clamp((S.mom[x.c]||0)+dm,-1.2,1.4)});
    res.title='🪑 Atril vacío'; res.text=`No fuiste al debate y los demás te pegaron sin respuesta. Ranking: ${rk.map((x,r)=>`${['🥇','🥈','🥉'][r]||(r+1)+'º'} ${esc(sn(x.c))}`).join(' · ')} · último: <b>vos</b> (ausente).`;
    res.chips=chips(fx,false)+cp('neg','▼ momentum'); res.good=false; S.prep=0;
    S.log.unshift({lbl:'🪑 Atril vacío', items:['Faltaste al debate.']});
  } else if(ev.debate){
    if(S.deb.q===0) S.res.e=clamp(S.res.e-8,0,100);
    const sc=debateScore(o.style)+(ev.bon[o.style]||0); const tier=sc>=64?'b':sc>=44?'c':'f';
    const fx={b:{nat:.5},c:{nat:.1},f:{nat:-.4}}[tier]; if(o.style==='ataque'&&tier==='b') fx.riv=.4; if(o.style==='ataque'&&tier==='f') fx.i=-2;
    const real=applyEff(fx); S.deb.res.push({tier,chips:chips(real,false)});
    const tl=tiltOf(ev,i);
    if(S.deb.q<ev.qs.length-1){ if(tl) S.tilt+=tl*.04; S.weekLog.push(`Debate · ${ev.qs[S.deb.q].tema}: ${o.l} ${TIER_IC[tier]}`); S.deb.q++; render(); return; }
    const n=ev.qs.length, pts=S.deb.res.reduce((a,r)=>a+({b:2,c:1,f:0}[r.tier]),0);
    const win=pts>=n*1.5, ok=pts>=n*.9;
    const fin=applyEff(win?{nat:1.5,i:5}:ok?{nat:.4,i:2}:{nat:-1,i:-5});
    const flash=clamp(Math.round((win?38:ok?24:12)*(S.active.length<=2?1.6:1)+randn()*5),3,80);
    // ranking del debate: el orden mueve el momentum de todos
    const myS=pts/(2*n)*100+randn()*6;
    const rk=S.active.filter(c=>c!==S.deb.absent).map(c=>({c,s:c===S.p?myS:38+C[c].str*22+randn()*15})).sort((x,y)=>y.s-x.s);
    if(S.deb.absent!=null){const a=S.deb.absent;S.mom[a]=clamp((S.mom[a]||0)-.8,-1.2,1.4);natShift(a,-vol(.6));}
    rk.forEach((x,r)=>{const dm=rk.length>1?.7-1.4*r/(rk.length-1):0; S.mom[x.c]=clamp((S.mom[x.c]||0)+dm,-1.2,1.4)});
    const myRank=rk.findIndex(x=>x.c===S.p)+1;
    res.title=win?'🌟 ¡Ganaste el debate!':ok?'👍 Debate correcto':'😬 Debate flojo';
    res.text=`Bloques: ${S.deb.res.map((r,k)=>`${TIER_IC[r.tier]} ${ev.qs[k].tema}`).join(' · ')}. Encuesta flash: ${flash}% cree que ganaste.<br>🏅 <b>Ranking del debate:</b> ${rk.map((x,r)=>`${['🥇','🥈','🥉'][r]||(r+1)+'º'} ${x.c===S.p?'<b>'+esc(sn(x.c))+'</b>':esc(sn(x.c))}`).join(' · ')}. Quedaste ${myRank}º: ${myRank===1?'arrancás con viento de cola':myRank===rk.length?'salís con la tendencia en contra':'el orden mueve el momentum de cada uno'}.${S.deb.absent!=null?` 🪑 ${esc(C[S.deb.absent].name)} faltó y lo paga.`:''}`;
    S.log.unshift({lbl:'🎤 Ranking del debate', items:[rk.map((x,r)=>`${r+1}. ${C[x.c].name}`).join(' · ')]});
    res.chips=chips(fin,false); res.good=ok; S.prep=0;
  } else if(o.risk){
    let p=clamp(o.risk.p+(S.res.i-50)/250,.1,.9);
    const ok=rnd()<p; const fx=applyEff(ok?o.risk.ok:o.risk.ko,o);
    res.title=ok?'🎲 ¡Salió bien!':'🎲 Salió mal'; res.text=ok?o.risk.okT:o.risk.koT; res.chips=chips(fx,false); res.good=ok;
  } else if(o.fn){
    const r=o.fn(); res={...res,...r};
  } else {
    const fx=applyEff(o.eff,o); res.title='✅ Decisión tomada'; res.text=''; res.chips=chips(fx,false);
  }
  const tl=tiltOf(ev,i); if(tl){S.tilt+=tl*.06; res.chips=(res.chips||'')+tiltChip(tl)}
  S.evRes=res; S.phase='agenda';
  S.weekLog.push(`Noticia «${ev.t}»: ${o.l}. ${res.title.replace(/^[^\wÁÉÍÓÚ¡]+/,'')}`);
  render();
}

function repFactor(r){const n=S.recent.filter(x=>x.r===r&&x.t>=S.turn-1&&x.round===S.round).length;return Math.pow(.6,n)}
function actGain(a,r=S.sel){

  if(a.id==='entrevista') return .45*m*(trait('viral')?1.4:1);
  if(a.id==='contraste') return 1*m;
  return 0;
}

}
function actBlock(a){
  if(S.phase!=='agenda') return 'Primero respondé la noticia';

function runoffTransfer(a,b){
  const elim=S.active.filter(c=>c!==a&&c!==b);
  // cada votante de los eliminados elige al finalista más cercano en el eje ideológico, o vota en blanco si ambos le quedan lejos
  const cal=spCalib(); const d=dens(S.mu,S.pol); const ia=cal.act.indexOf(a), ib=cal.act.indexOf(b); const fr={};
  elim.forEach(c=>fr[c]={a:0,b:0,bl:0,t:0});
  GRID.forEach((v,g)=>{const u=cal.act.map((c,i)=>Math.exp(cal.V[i]-LAM*(v-S.pos[c])**2));const tot=u.reduce((x,y)=>x+y,0)+Math.exp(cal.V0);
    const ua=Math.exp(cal.V[ia]-LAM*(v-S.pos[a])**2), ub=Math.exp(cal.V[ib]-LAM*(v-S.pos[b])**2), ubl=Math.exp(cal.V0+.9), t2=ua+ub+ubl;
    elim.forEach(c=>{const w=d[g]*u[cal.act.indexOf(c)]/tot;fr[c].a+=w*ua/t2;fr[c].b+=w*ub/t2;fr[c].bl+=w*ubl/t2;fr[c].t+=w})});
  S.transfers=elim.map(c=>({c,a:fr[c].a/fr[c].t,b:fr[c].b/fr[c].t,bl:fr[c].bl/fr[c].t}));
  S.sh.forEach(s=>{S.transfers.forEach(tr=>{const v=s[tr.c];s[tr.c]=0;s[a]+=v*tr.a;s[b]+=v*tr.b})});
  S.log.unshift({lbl:'⚖️ Traspaso de votos al balotaje', items:S.transfers.map(tr=>`Votantes de ${esc(C[tr.c].name)}: ${Math.round(tr.a*100)}% a ${esc(sn(a))}, ${Math.round(tr.b*100)}% a ${esc(sn(b))}, ${Math.round(tr.bl*100)}% en blanco`)});
  S.active=[a,b]; S.round=2; S.turn=1; S.prep=0; S.recent=[];
  S.prevNat=national(); S.mom=S.mom.map((m,c)=>S.active.includes(c)?m*.5:0);
  S.hist.push({lbl:'B0', poll:makePoll(), sep:true});
}
function startRunoff(){
  closeModal();

  S.phase='event'; S.ap=2; S.evRes=null;

/* balotaje sin vos: se simula semana a semana, con tu apoyo opcional */
function simulateRunoff(endorse){
  closeModal();
  const [a,b]=S.r1.order; const mine=S.sh.map(r=>r[S.p]);
  runoffTransfer(a,b);
  if(endorse!=null){
    const o=endorse===a?b:a, k=.3*prox(S.p,endorse); let moved=0;
    S.sh.forEach((s,r)=>{const v=mine[r]*k; const take=Math.min(v*.5,s[o]*.3); s[o]-=take; s[endorse]+=v; moved+=v*REG[r].w;
      const t=s.reduce((x,y)=>x+y,0); if(t>100){const f=100/t; s.forEach((x,i)=>s[i]=x*f)}});
    S.log.unshift({lbl:'📣 Tu apoyo en el balotaje', items:[`Llamaste a votar a ${esc(C[endorse].name)}: ≈ ${fmt(moved)} pts más de tus votantes lo siguen${k<.15?' (pocos: estás lejos ideológicamente)':''}.`]});
  } else S.log.unshift({lbl:'📣 Tu apoyo en el balotaje', items:['Diste libertad de acción a tus votantes.']});
  S.endorse=endorse;
  for(let t=1;t<=T2;t++){ S.turn=t; autoWeek(); }
  S.turn=T2; S.over=false; election();
}
function autoWeek(){
  const lines=[];
  S.active.forEach(c=>{const str=C[c].str*1.35; const r=wpick(REG.map((rg,i)=>rg.w*C[c].aff[i]**2)); shift(r,c,(.6+rnd()*1.2)*str*1.8); natShift(c,randn()*.5)});
  inflationStep(lines);
  if(S.turn===DEB2){const c=S.active[rnd()<.5?0:1];const g=1+rnd()*1.5;natShift(c,g);S.mom[c]=clamp((S.mom[c]||0)+.6,-1.2,1.2);const o=S.active.find(x=>x!==c);S.mom[o]=clamp((S.mom[o]||0)-.6,-1.2,1.2);lines.push(`🎤 ${esc(C[c].name)} ganó el debate (${sgn(g)} pts)`)}
  if(rnd()<.25){const c=S.active[rnd()<.5?0:1];const g=(rnd()<.5?-1:1)*(1.2+rnd()*2.3);natShift(c,g);lines.push(`⚡ Sorpresa: ${esc(C[c].name)} ${g>0?'crece':'cae'} fuerte (${sgn(g)} pts)`)}
  {const cal=spCalib(); const np=S.pos.slice();
   S.active.forEach(c=>{const opts=[-.04,0,.04].map(dx=>clamp(S.pos[c]+dx,C[c].lean-.22,C[c].lean+.22));let best=opts[1],bv=-1e9;
     opts.forEach(x=>{const pm=np.slice();pm[c]=x;const v=spEval(cal,pm)[cal.act.indexOf(c)];if(v>bv){bv=v;best=x}});np[c]=best});
   const nmu=clamp(S.mu+randn()*.02,-.6,.6); applyNatDelta(cal.act,spEval(cal,np,nmu,S.pol)); S.pos=np; S.mu=nmu;}
  momentumStep(lines);
  S.bias=S.bias.map(x=>x*.96+randn()*.3);
  S.sh.forEach(s=>{const mv=s[U]*.15;const tot=S.active.reduce((x,c)=>x+s[c],0);S.active.forEach(c=>s[c]+=mv*s[c]/tot);s[U]-=mv});
  S.prevNat=national(); const poll=makePoll(); S.hist.push({lbl:'B'+S.turn, poll});
  S.log.unshift({lbl:`Balotaje simulado · semana ${S.turn}`, items:[`Encuesta: ${S.active.map(c=>`${esc(sn(c))} ${fmt(poll[c])}%`).join(' – ')}`,...lines]});
}

function customErrors(){
  const cc=setup.custom; if(cc.cands.length<2) return 'Necesitás al menos dos partidos.';
  const sum=cc.cands.reduce((a,c)=>a+(+c.pct||0),0)+(+cc.und||0);
  if(Math.abs(sum-100)>.6) return `Los porcentajes (incluidos los indecisos) tienen que sumar 100. Hoy suman ${fmt(sum)}.`;
  if(cc.cands.some(c=>!(+c.pct>0))) return 'Cada partido necesita un porcentaje mayor que cero.';
  return '';
}

}
function renderIdeo(){
  const W=340,H=170,L=14,R=14,T=12,B=46; const d=dens(S.mu,S.pol), d0=dens(SC.mu,SC.pol); const mx=Math.max(...d,...d0);
  const X=v=>L+(W-L-R)*(v+1.5)/3, Y=y=>T+(H-T-B)*(1-y/mx), base=H-B;
  const line=arr=>arr.map((y,i)=>(i?'L':'M')+X(GRID[i]).toFixed(1)+','+Y(y).toFixed(1)).join('');
  let g=`<path d="${line(d)}L${X(1.5)},${base}L${X(-1.5)},${base}Z" fill="#6ec6f5" fill-opacity=".35" stroke="#2f8fe0" stroke-width="2"/>`;
  g+=`<path d="${line(d0)}" fill="none" style="stroke:var(--ink)" stroke-opacity=".35" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  const items=S.active.map(c=>({c,x:X(clamp(S.pos[c],-1.45,1.45))})).sort((a,b)=>a.x-b.x); let lastX=-99,row=0;
  items.forEach(it=>{row=(it.x-lastX<34)?1-row:0;lastX=it.x;const me=it.c===S.p;const ly=base+16+row*14;
    g+=`<line x1="${it.x}" x2="${it.x}" y1="${base-6}" y2="${ly-9}" stroke="${C[it.c].color}" stroke-width="1.5"/><circle cx="${it.x}" cy="${base}" r="${me?7:5}" fill="${C[it.c].color}" style="stroke:var(--ink)" stroke-width="1.5"/>
       <text x="${it.x}" y="${ly}" font-size="10" font-weight="${me?800:600}" text-anchor="middle" fill="${C[it.c].color}">${esc(C[it.c].sig)}</text>`});
  g+=`<text x="${L}" y="${H-2}" font-size="10" style="fill:var(--gridtxt)">◀ Izquierda</text><text x="${W/2}" y="${H-2}" font-size="10" text-anchor="middle" style="fill:var(--gridtxt)">Centro</text><text x="${W-R}" y="${H-2}" font-size="10" text-anchor="end" style="fill:var(--gridtxt)">Derecha ▶</text>`;
  const dm=S.mu-SC.mu; const clima=Math.abs(dm)<.03?'no se movió mucho desde el inicio':`se corrió hacia la ${dm<0?'izquierda':'derecha'} desde el inicio`;
  return `<div class="card"><h3>🧭 Mapa ideológico</h3>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribución de votantes y posición de cada candidatura">${g}</svg>
    <div class="rule">La curva celeste muestra dónde están los votantes; la punteada, cómo estaban al empezar. La opinión pública ${clima}${S.pol-SC.pol>.04?' y está más polarizada':''}. Te perciben como de <b>${ideoLbl(S.pos[S.p])}</b>.</div></div>`;
}

function chartSVG(){
  const W=340,H=236,L=30,R=52,T=12,B=30;
  const hist=S.hist, R1=T1+1, B0=T1+2, R2=T1+T2+3;
  const planned=(S.round===2||hist.some((h,i)=>i>R1))?R2:R1;
  const maxX=Math.max(planned,hist.length-1);
  const ids=[...new Set(hist.flatMap(h=>h.poll.map((v,c)=>v!=null&&c!==U?c:null)).filter(x=>x!=null))];
  let maxV=0; hist.forEach(h=>h.poll.forEach((v,c)=>{if(v!=null&&c!==U)maxV=Math.max(maxV,v)}));
  const yMax=Math.max(50,Math.ceil((maxV+4)/10)*10);
  const x=i=>L+(W-L-R)*i/maxX, y=v=>T+(H-T-B)*(1-v/yMax);
  let g='';
  for(let v=0;v<=yMax;v+=10) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line2)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" style="fill:var(--gridtxt)">${v}</text>`;
  const gl=S.round===1?45:50;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(gl)}" y2="${y(gl)}" stroke="#ff5c8a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${y(gl)-4}" font-size="10" font-weight="700" fill="#d43a6a">${S.round===1?'45% gana en 1ª vuelta':'50%'}</text>`;
  [DEB1, maxX>=R2?B0+DEB2:null].forEach(db=>{if(db!=null&&db<=maxX) g+=`<line x1="${x(db)}" x2="${x(db)}" y1="${T}" y2="${H-B}" style="stroke:var(--ink)" stroke-opacity=".12" stroke-width="9"/><text x="${x(db)}" y="${H-B+26}" font-size="9" text-anchor="middle">🎤</text>`});
  if(maxX>=R2){const sx=x(R1+.5);g+=`<line x1="${sx}" x2="${sx}" y1="${T}" y2="${H-B}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><text x="${sx+3}" y="${T+10}" font-size="9" font-weight="700" style="fill:var(--ink)">balotaje →</text>`}
  const lblAt=i=>hist[i]?(i===0?'0':hist[i].lbl):(i<=T1?'S'+i:i===R1?'1ªV':i===R2?'Bal.':'B'+(i-B0));
  for(let i=0;i<=maxX;i++){const isR=i===R1||i===R2; if(!isR&&i%2) continue; if(!isR&&(i===R1+1||i===R2-1||i===R1-1&&maxX>R1)) continue;
    g+=`<text x="${x(i)}" y="${H-B+13}" font-size="9" text-anchor="middle" font-weight="${isR?800:400}" style="fill:${isR?'var(--ink)':'var(--gridtxt)'}">${lblAt(i)}</text>`}
  const labels=[]; const li=hist.length-1;
  ids.sort((a,b)=>a===S.p?1:b===S.p?-1:0).forEach(c=>{
    const me=c===S.p, col=C[c].color;
    const pts=hist.map((h,i)=>h.poll[c]!=null&&!h.result?[x(i),y(h.poll[c])]:null);
    let d='',on=false; pts.forEach(p=>{if(p){d+=(on?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);on=true}else on=false});
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${me?4:2.4}" stroke-linejoin="round" stroke-linecap="round" opacity="${me?1:.85}"/>`;
    if(me) pts.forEach(p=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" style="fill:var(--surface)" stroke="${col}" stroke-width="2"/>`});
    hist.forEach((h,i)=>{if(!h.result||h.poll[c]==null) return; let j=i-1; while(j>=0&&!pts[j]) j--;
      const X=x(i),Y=y(h.poll[c]);
      if(j>=0) g+=`<path d="M${pts[j][0].toFixed(1)},${pts[j][1].toFixed(1)}L${X.toFixed(1)},${Y.toFixed(1)}" stroke="${col}" stroke-width="${me?2.5:1.8}" stroke-dasharray="3 3" fill="none"/>`;
      const r=me?7:5.5; g+=`<path d="M${X},${Y-r}L${X+r},${Y}L${X},${Y+r}L${X-r},${Y}Z" fill="${col}" style="stroke:var(--ink)" stroke-width="1.5"><title>${esc(sn(c))}: ${fmt(h.poll[c])}% (resultado ${h.lbl==='1ªV'?'de la 1ª vuelta':'del balotaje'})</title></path>`;});
    const lv=hist[li].poll[c];
    if(lv!=null){ if(!hist[li].result) g+=`<circle cx="${x(li)}" cy="${y(lv)}" r="${me?5.5:4}" fill="${col}" style="stroke:var(--ink)" stroke-width="1.5"/>`; labels.push({c,yy:y(lv),v:lv,xx:x(li)}) }
  });
  labels.sort((a,b)=>a.yy-b.yy); for(let i=1;i<labels.length;i++) if(labels[i].yy-labels[i-1].yy<12) labels[i].yy=labels[i-1].yy+12;
  labels.forEach(l=>g+=`<text x="${l.xx+9}" y="${l.yy+4}" font-size="11" font-weight="800" fill="${C[l.c].color}">${fmt(l.v)}</text>`);
  const leg=ids.map(c=>`<span><i style="background:${C[c].color};${c===S.p?'height:6px':''}"></i>${c===S.p?'<b>'+esc(sn(c))+' (vos)</b>':esc(sn(c))}</span>`).join('');
  const hasR=hist.some(h=>h.result);
  return `<div class="legend">${leg}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de la intención de voto">${g}</svg>${hasR?'<div class="rule">Las líneas son encuestas (con indecisos y su margen de error); los rombos ◆ son el resultado real, sobre votos válidos.</div>':''}`;
}
function renderChart(){
  return `<div class="card"><h3>📈 Intención de voto, semana a semana</h3>${chartSVG()}
    <div class="rule">Encuestas publicadas, margen ±${S.precise>0?'0,5 (encuesta propia activa)':'1,6'}. Los indecisos no se grafican.</div></div>`;
}

function renderPolls(){
  const p=lastPoll(); const ids=S.active.slice().sort((a,b)=>p[b]-p[a]);
  const rows=ids.map(c=>`<div class="prow ${c===S.p?'me':''}"><span class="nm">${momIcon(c)} ${esc(sn(c))}</span><span class="tr"><i style="width:${Math.min(100,p[c]*1.6)}%;background:${C[c].color}"></i></span><span class="v">${fmt(p[c])}%</span></div>`).join('')
   +`<div class="prow"><span class="nm" style="color:var(--muted)">Indecisos</span><span class="tr"><i style="width:${p[U]*1.6}%;background:${UND_COLOR}"></i></span><span class="v">${fmt(p[U])}%</span></div>`
   +(S.round===2?`<div class="prow"><span class="nm" style="color:var(--muted)">En blanco*</span><span class="tr"><i style="width:${blankNow()*1.6}%;background:#ddd6c4"></i></span><span class="v">${fmt(blankNow())}%</span></div>`:'');
  const tot=ids.reduce((a,c)=>a+p[c],0); const v=c=>p[c]/tot*100;
  const [a,b]=ids; let txt, bg;
  const goal=C[S.p].goal;
  if(S.round===2&&!S.active.includes(S.p)){ txt=`Balotaje sin vos: ${esc(sn(a))} ${fmt(v(a))}% – ${esc(sn(b))} ${fmt(v(b))}% (votos válidos).`; bg='var(--midbg)'; }
  else if(S.round===2){ txt=a===S.p?`Con esta encuesta: <b>ganás</b> ${fmt(v(a))} a ${fmt(v(b))} (votos válidos).`:`Con esta encuesta: <b>perdés</b> ${fmt(v(S.p))} a ${fmt(v(a))} (votos válidos).`; bg=a===S.p?'var(--okbg)':'var(--badbg)'; }
  else if(goal.type==='pct'){ const ok=v(S.p)>=goal.v; txt=`Objetivo ${fmt(goal.v)}% de los votos válidos · con esta encuesta, sin indecisos, tendrías <b>${fmt(v(S.p))}%</b> ${ok?'✅':'❌'}`; bg=ok?'var(--okbg)':'var(--badbg)'; }
  else { const first=v(a)>=45||(v(a)>=40&&v(a)-v(b)>=10);
    if(first&&a===S.p){txt=`Con esta encuesta: <b>ganás en primera vuelta</b> (${fmt(v(a))}% de los votos válidos).`;bg='var(--okbg)'}
    else if(first){txt=`Con esta encuesta: <b>gana ${esc(C[a].name)}</b> en primera vuelta.`;bg='var(--badbg)'}
    else if(a===S.p||b===S.p){txt=`Con esta encuesta: <b>balotaje</b> contra ${esc(C[a===S.p?b:a].name)}.`;bg='var(--midbg)'}
    else {txt=`Con esta encuesta: <b>quedás afuera</b>; el balotaje sería ${esc(C[a].sig)} vs ${esc(C[b].sig)}.`;bg='var(--badbg)'} }
  return `<div class="card"><h3>🗳️ Última encuesta</h3><div class="polls">${rows}</div>
    <div class="verdict" style="background:${bg}">${txt}</div>${Object.keys(S.wd).length?`<div class="rule">🏳️ Se bajaron: ${Object.entries(S.wd).map(([c,w])=>`${esc(sn(+c))} (apoya a ${esc(sn(w.to))})`).join(', ')}.</div>`:''}
    <div class="rule">Las flechas muestran la tendencia de cada candidatura (▲ crece, ▶ estable, ▼ cae). Las barras incluyen a los indecisos; el recuadro los saca y recalcula sobre votos válidos, que es como se cuenta la elección. Ambos vienen de la encuesta, no del voto real. ${S.round===1?'Gana en 1ª vuelta quien saca 45% de los votos válidos, o 40% con 10 puntos de ventaja sobre el segundo.':'En el balotaje gana quien saque más votos válidos; si sale voto a voto, desempata la militancia que fiscaliza (🛡️ '+S.active.map(c=>esc(sn(c))+' '+milOf(c)).join(' · ')+'). *Estimación: votantes de los eliminados que no se sienten representados por ningún finalista.'}</div></div>`;
}

/* =========================================================
   MODALES
   ========================================================= */
function showModal(h,closable){const m=$('#modal');m.innerHTML=`<div class="mbox">${closable?'<button class="mclose" onclick="closeModal()" aria-label="Cerrar">✕</button>':''}${h}</div>`;m.dataset.closable=closable?'1':'';m.classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2600)}

function showSummary(prev,poll,rivalLines,myLines,inc,last,swan){
  const ids=S.active.slice().sort((a,b)=>poll[b]-poll[a]);
  const rows=ids.map(c=>{const d=poll[c]-(prev[c]??0);return `<tr><td>${momIcon(c)} <span style="display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-1px;background:${C[c].color}"></span> ${c===S.p?'<b>'+esc(C[c].name)+' (vos)</b>':esc(C[c].name)}</td><td class="n">${fmt(prev[c]??0)}%</td><td class="n">→ ${fmt(poll[c])}%</td><td class="n ${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${fmt(Math.abs(d))}</td></tr>`}).join('');
  const sw=swan?`<div class="swan"><div class="eyebrow">🦢 Cisne negro</div><h3>${swan.ico} ${swan.t}</h3><p>${swan.txt}</p>${swan.resp?'<p class="rule">La semana que viene vas a tener que responder.</p>':''}</div>`:'';
  if(swan) S.log.unshift({lbl:`🦢 Cisne negro · ${swan.t}`, items:[swan.txt.replace(/<[^>]+>/g,'')]});
  showModal(`<div class="eyebrow">Cierre de la semana ${S.turn}${S.round===2?' del balotaje':''}</div>${sw}
    <h2>📊 Nueva encuesta</h2>
    <table class="cmp">${rows}<tr><td style="color:var(--muted)">Indecisos</td><td class="n">${fmt(prev[U])}%</td><td class="n">→ ${fmt(poll[U])}%</td><td></td></tr></table>
    <h3 style="margin-top:12px">🧑‍💼 Tu semana</h3><ul class="mlist">${myLines.map(x=>`<li>${x}</li>`).join('')||'<li>No hiciste actividades.</li>'}<li>Ingresos: +${inc} 💰, +4 ⚡</li></ul>
    <h3 style="margin-top:12px">👀 Lo que pasó en la campaña</h3><ul class="mlist">${rivalLines.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="row"><button class="big ${last?'alt':''}" onclick="nextWeek()">${last?'Ir a la noche electoral 🗳️':`Empezar la semana ${S.turn+1} →`}</button></div>`);
}

function showHelp(first){
  showModal(`<div class="eyebrow">${first?'Antes de arrancar':'Ayuda'}</div><h2>Cómo se juega</h2>
   <div class="how" style="margin:12px 0">
     <div><span class="n">1</span><div><b>📰 Noticia de la semana</b><span>Cada semana pasa algo. Tenés que responder antes de seguir. Cada opción muestra su efecto; las que tienen 🎲 son apuestas (tu imagen mejora las chances).</span></div></div>
     <div><span class="n">2</span><div><b>🗓️ Agenda: 2 acciones</b><span>Marcá una región en el mapa y elegí actividades. Debajo de cada tarjeta ves cuánto rendiría. Repetir la misma región dos semanas seguidas rinde menos.</span></div></div>
     <div><span class="n">3</span><div><b>📈 Cerrar la semana</b><span>Los rivales hacen campaña, algunos indecisos se definen y sale una encuesta nueva en el gráfico de la derecha.</span></div></div>
   </div>
   <ul class="mlist">
     <li><b>💰 Fondos</b> pagan la campaña. <b>⚡ Energía</b> baja con cada actividad: debajo de 20 todo rinde 40% menos. <b>⭐ Imagen</b> multiplica todo lo que hacés.</li>
     <li>En la semana ${DEB1} hay <b>🎤 debate</b> en cuatro bloques (economía, un tema social, un cruce con un rival y el minuto final); en el balotaje, tres. Prepararlo antes mejora mucho tus chances.</li>
     <li><b>🛡️ Militancia</b> fiscaliza la elección (cuida votos) y sale a desmentir operaciones en tu contra, como un deepfake en la veda.</li>
     <li><b>🎲 Nada es seguro:</b> los efectos marcados con ~ son estimaciones y pueden salir mucho mejor, mucho peor o al revés. Hay sorpresas semanales y las encuestas pueden tener un sesgo que no ves hasta la noche electoral.</li>
     <li><b>🧭 Discurso:</b> cada semana elegís si correrte a la izquierda o a la derecha, y algunas respuestas a noticias también te corren. Los votantes están repartidos en un eje que se mueve con la agenda: acercarte a donde hay más votantes suma, pero los giros bruscos o alejarte mucho de tu identidad cuestan imagen. En el balotaje, los votantes de los eliminados eligen al finalista más cercano, o votan en blanco.</li>
     <li><b>📈 Momentum:</b> las subas y bajas tienden a continuar algunas semanas (▲ / ▼ junto a cada nombre), hasta que algo cambia la tendencia. Una buena semana tuya te da envión para las siguientes.</li>
     <li><b>📱 Medios:</b> cada fuerza tiene su público. TikTok rinde mucho más para un electorado joven (Milei, la izquierda, un outsider) que para uno tradicional (Schiaretti, Lavagna), y con la tele pasa al revés. Las noticias sobre redes y medios muestran cuánto te rinde cada canal.</li>
     <li><b>🦢 Cisnes negros:</b> muy de vez en cuando pasa algo enorme (una crisis, una catástrofe, un escándalo general) que cambia el humor del país.</li>
     <li><b>🏛️ Congreso:</b> después de las generales ves cuántos diputados y senadores gana cada fuerza.</li>
     <li><b>🤝 Negociaciones:</b> a veces otros partidos o gobernadores te ofrecen acuerdos. Solo negocian fuerzas cercanas en el eje ideológico: si te corrés, cambian tus aliados posibles. Aceptar, regatear o rechazar cambia quién se queda con esos votos.</li>
     <li>Ganás en primera vuelta con <b>45%</b>, o con <b>40% y 10 de ventaja</b>. Si no, balotaje de 4 semanas entre los dos primeros.</li>
   </ul>
   <div class="row"><button class="big" onclick="closeModal()">${first?'¡A la campaña!':'Entendido'}</button></div>`);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').dataset.closable){closeModal();return}
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if(!S||!$('#modal').classList.contains('hidden')){ if(e.key==='Enter'&&S&&!$('#modal').classList.contains('hidden')){const b=$('#modal .big');if(b)b.click()} return }
  if(S.phase==='event'&&['1','2','3'].includes(e.key)){const i=+e.key-1;if(S.ev.opts[i]){const btn=document.querySelectorAll('.opt')[i];if(btn&&!btn.disabled)chooseOpt(i)}}
  if(S.phase==='agenda'&&e.key==='Enter'&&S.ap===0) endWeek();
});
render();

</script>
